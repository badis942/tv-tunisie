<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TV Tunisie">
<meta name="theme-color" content="#000000">
<title>TV Tunisie – Watania 1 & 2</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<style>
  :root{--red:#e70013;--focus:#ffd34d;--bg:#000;--bar:#111;--mute:#9a9aa6}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:#fff;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic",sans-serif}
  body{display:flex;flex-direction:column}
  .stage{flex:1;position:relative;background:#000;display:flex;align-items:center;justify-content:center;min-height:0}
  video{width:100%;height:100%;max-height:100%;background:#000}
  .msg{position:absolute;inset:auto 0 20px 0;text-align:center;color:var(--mute);font-size:15px;padding:0 20px;pointer-events:none}
  .bar{display:flex;gap:12px;padding:12px;background:var(--bar);justify-content:center;flex-wrap:wrap}
  button{background:#22222a;color:#fff;border:3px solid transparent;border-radius:14px;
    padding:12px 22px;font-size:clamp(15px,1.8vw,22px);font-weight:700;cursor:pointer;outline:none;
    display:flex;align-items:center;gap:10px}
  button .n{background:var(--red);border-radius:8px;padding:2px 10px}
  button.active{background:#3a1015}
  button:focus,button:hover{border-color:var(--focus)}
</style>
</head>
<body>
  <div class="stage">
    <video id="v" controls playsinline autoplay></video>
    <div class="msg" id="msg"></div>
  </div>
  <div class="bar">
    <button data-ch="watania1" autofocus><span class="n">1</span> Watania 1 · الوطنية 1</button>
    <button data-ch="watania2"><span class="n">2</span> Watania 2 · الوطنية 2</button>
    <button id="fs">⛶ Plein écran</button>
  </div>

<script>
  // Flux officiels de la Télévision tunisienne (serveur tanitweb).
  // Pour chaque chaîne, plusieurs noms sont essayés dans l'ordre.
  var BASE = "https://sw1.tanitweb.net/TunisiaTV/_definst_/";
  var NAMES = ["playlist.m3u8", "playlist_DVR.m3u8"];

  var video = document.getElementById('v');
  var msg = document.getElementById('msg');
  var hls = null;

  function say(t){ msg.textContent = t || ""; }

  function tryPlay(ch, i){
    if(i >= NAMES.length){
      say("Impossible de lire " + ch + ". Le flux est peut-être protégé ou indisponible pour le moment.");
      return;
    }
    var url = BASE + ch + "/" + NAMES[i];
    say("Chargement…");
    if(hls){ hls.destroy(); hls = null; }

    if(window.Hls && Hls.isSupported()){
      hls = new Hls({ lowLatencyMode:false });
      hls.loadSource(url);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, function(){ say(""); video.play().catch(function(){ say("Appuyez sur ▶ pour lancer la vidéo."); }); });
      hls.on(Hls.Events.ERROR, function(_, d){
        if(d.fatal){
          if(d.type === Hls.ErrorTypes.NETWORK_ERROR && d.details && d.details.indexOf("manifest") !== -1){
            tryPlay(ch, i+1);
          } else if(d.type === Hls.ErrorTypes.MEDIA_ERROR){
            hls.recoverMediaError();
          } else {
            tryPlay(ch, i+1);
          }
        }
      });
    } else if(video.canPlayType('application/vnd.apple.mpegurl')){
      // iPhone / Safari : lecture HLS native
      video.src = url;
      video.onerror = function(){ tryPlay(ch, i+1); };
      video.onloadedmetadata = function(){ say(""); };
      video.play().catch(function(){ say("Appuyez sur ▶ pour lancer la vidéo."); });
    } else {
      say("Ce navigateur ne sait pas lire ce type de flux.");
    }
  }

  var buttons = Array.prototype.slice.call(document.querySelectorAll('button[data-ch]'));
  buttons.forEach(function(b){
    b.addEventListener('click', function(){
      buttons.forEach(function(x){ x.classList.remove('active'); });
      b.classList.add('active');
      try{ localStorage.setItem('ch', b.dataset.ch); }catch(e){}
      tryPlay(b.dataset.ch, 0);
    });
  });

  document.getElementById('fs').addEventListener('click', function(){
    var el = video;
    if(el.requestFullscreen) el.requestFullscreen().catch(function(){});
    else if(el.webkitEnterFullscreen) el.webkitEnterFullscreen();
  });

  // Télécommande : flèches gauche/droite entre les boutons
  var all = Array.prototype.slice.call(document.querySelectorAll('.bar button'));
  document.addEventListener('keydown', function(e){
    var i = all.indexOf(document.activeElement);
    if(e.key === 'ArrowRight'){ e.preventDefault(); all[(i+1)%all.length].focus(); }
    if(e.key === 'ArrowLeft'){ e.preventDefault(); all[(i-1+all.length)%all.length].focus(); }
  });

  // Démarrage sur la dernière chaîne regardée
  var start = 'watania1';
  try{ start = localStorage.getItem('ch') || start; }catch(e){}
  var btn = buttons.filter(function(b){ return b.dataset.ch === start; })[0] || buttons[0];
  btn.focus(); btn.click();
</script>
</body>
</html>
