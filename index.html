<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TV Tunisie">
<meta name="theme-color" content="#000000">
<title>TV Tunisie</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23e70013'/%3E%3Ccircle cx='32' cy='32' r='17' fill='%23fff'/%3E%3Ccircle cx='35' cy='32' r='11' fill='%23e70013'/%3E%3Ccircle cx='38' cy='32' r='9' fill='%23fff'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%23e70013'/%3E%3Ccircle cx='90' cy='90' r='48' fill='%23fff'/%3E%3Ccircle cx='98' cy='90' r='31' fill='%23e70013'/%3E%3Ccircle cx='106' cy='90' r='25' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Noto+Kufi+Arabic:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<style>
  :root{--red:#e70013;--red2:#ff3b4a;--focus:#ffd34d;--txt:#f5f5f7;--mute:#9a9aa6}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#000;color:var(--txt);overflow:hidden;
    font-family:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif}
  body.nocursor, body.nocursor *{cursor:none !important}
  .ar{font-family:"Noto Kufi Arabic","Outfit",sans-serif;direction:rtl}

  /* Vidéo plein écran */
  video{position:fixed;inset:0;width:100vw;height:100vh;object-fit:contain;background:#000}

  /* Bandeau chaîne (OSD) */
  .osd{position:fixed;left:4vw;bottom:6vh;display:flex;align-items:center;gap:18px;
    background:linear-gradient(90deg,rgba(0,0,0,.85),rgba(0,0,0,.55));backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:14px 26px 14px 14px;
    transition:opacity .35s, transform .35s;opacity:0;transform:translateY(12px);pointer-events:none}
  .osd.show{opacity:1;transform:none}
  .osd .num{width:64px;height:64px;border-radius:16px;background:var(--red);display:grid;place-items:center;
    font-size:36px;font-weight:800;box-shadow:0 8px 30px rgba(231,0,19,.5)}
  .osd .name{font-size:28px;font-weight:700}
  .osd .sub{display:flex;align-items:center;gap:10px;margin-top:2px;color:var(--mute);font-size:16px}
  .badge{font-size:12px;font-weight:800;letter-spacing:1px;background:var(--red);color:#fff;padding:3px 8px;border-radius:6px;
    display:inline-flex;align-items:center;gap:6px}
  .badge i{width:7px;height:7px;border-radius:50%;background:#fff;animation:pulse 1.3s infinite}
  @keyframes pulse{50%{opacity:.25}}
  .digits{position:fixed;top:4vh;left:50%;transform:translateX(-50%);font-size:72px;font-weight:800;color:#fff;
    background:rgba(0,0,0,.7);border:2px solid rgba(255,255,255,.15);padding:6px 34px;border-radius:20px;
    font-variant-numeric:tabular-nums;letter-spacing:6px;display:none;text-shadow:0 4px 20px rgba(0,0,0,.6)}
  .digits.show{display:block}
  .digits.bad{color:var(--red2);font-size:28px;letter-spacing:0;padding:18px 28px}
  .clock{position:fixed;top:4vh;right:4vw;font-size:22px;font-variant-numeric:tabular-nums;color:#fff;
    background:rgba(0,0,0,.55);padding:8px 16px;border-radius:999px;transition:opacity .35s;opacity:0}
  .clock.show{opacity:1}

  /* Panneau des chaînes */
  .panel{position:fixed;top:0;left:0;bottom:0;width:min(420px,88vw);padding:5vh 24px;
    background:linear-gradient(90deg,rgba(7,7,10,.96),rgba(7,7,10,.85) 70%,rgba(7,7,10,0));
    transform:translateX(-105%);transition:transform .3s ease;display:flex;flex-direction:column;gap:14px}
  .panel.open{transform:none}
  body:has(.panel.open) .osd{opacity:0}
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .logo{width:44px;height:44px;border-radius:12px;background:var(--red);display:grid;place-items:center}
  .brand h1{margin:0;font-size:24px;font-weight:800}
  .brand small{display:block;color:var(--mute);font-size:13px;font-weight:400}
  .ch{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:flex;align-items:center;gap:16px;padding:16px;
    border-radius:18px;background:rgba(255,255,255,.05);border:3px solid transparent;transition:transform .15s,border-color .15s,background .15s}
  .ch .n{flex:none;width:58px;height:58px;border-radius:14px;display:grid;place-items:center;font-size:30px;font-weight:800;
    background:#1a1a22}
  .ch .nm{font-size:22px;font-weight:600}
  .ch .ar{display:block;text-align:left;color:var(--mute);font-size:16px}
  .ch .live{margin-left:auto;font-size:12px;font-weight:800;color:var(--red2);letter-spacing:1px;opacity:0}
  .ch.playing{background:linear-gradient(135deg,rgba(231,0,19,.30),rgba(231,0,19,.08))}
  .ch.playing .n{background:var(--red)}
  .ch.playing .live{opacity:1}
  .ch.sel{border-color:var(--focus);transform:scale(1.03);background:rgba(255,255,255,.10)}
  .help{margin-top:auto;color:var(--mute);font-size:14px;line-height:1.7}
  .help b{color:#fff;background:rgba(255,255,255,.1);padding:1px 8px;border-radius:6px;font-weight:600}

  /* Chargement / message */
  .spinner{position:fixed;left:50%;top:50%;width:56px;height:56px;margin:-28px;border-radius:50%;
    border:4px solid rgba(255,255,255,.15);border-top-color:var(--red2);animation:spin .9s linear infinite;display:none}
  body.loading .spinner{display:block}
  @keyframes spin{to{transform:rotate(360deg)}}
  .msg{position:fixed;left:50%;top:58%;transform:translateX(-50%);background:rgba(0,0,0,.8);padding:12px 20px;border-radius:12px;
    font-size:18px;display:none;text-align:center;max-width:90vw}
  .msg.show{display:block}

  /* Petit écran (iPhone) */
  @media (max-width:600px){
    .osd{left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom))}
    .osd .num{width:52px;height:52px;font-size:28px}
    .osd .name{font-size:22px}
    .help{display:none}
  }
</style>
</head>
<body>
  <video id="v" playsinline autoplay></video>
  <div class="spinner"></div>
  <div class="msg" id="msg"></div>
  <div class="clock" id="clock">--:--</div>
  <div class="digits" id="digits"></div>

  <div class="osd" id="osd">
    <div class="num" id="osdNum">1</div>
    <div>
      <div class="name" id="osdName">Watania 1</div>
      <div class="sub"><span class="badge"><i></i>LIVE</span><span class="ar" id="osdAr">الوطنية الأولى</span></div>
    </div>
  </div>

  <nav class="panel" id="panel">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 30 30"><circle cx="15" cy="15" r="11" fill="#fff"/><circle cx="16.6" cy="15" r="7" fill="#e70013"/><circle cx="18.4" cy="15" r="5.6" fill="#fff"/><polygon fill="#e70013" points="18.7,15 22.5,13.6 20.2,16.9 20.2,13.1 22.5,16.4"/></svg>
      </div>
      <h1>TV Tunisie<small>Chaînes en direct</small></h1>
    </div>
    <div id="list"></div>
    <div class="help">
      <b>OK</b> liste des chaînes / choisir<br>
      <b>▲ ▼</b> naviguer · zapper<br>
      <b>1 2 3…</b> aller à une chaîne<br>
      <b>Retour</b> fermer la liste<br>
    </div>
  </nav>

<script>
(function(){
  // ---- Chaînes (ajouter ici de nouvelles chaînes) ----
  var BASE = "https://sw1.tanitweb.net/TunisiaTV/_definst_/";
  var CHANNELS = [
    { id:"watania1", name:"Watania 1", ar:"الوطنية الأولى", urls:[BASE+"watania1/playlist.m3u8", BASE+"watania1/playlist_DVR.m3u8"] },
    { id:"watania2", name:"Watania 2", ar:"الوطنية الثانية", urls:[BASE+"watania2/playlist.m3u8", BASE+"watania2/playlist_DVR.m3u8"] }
  ];

  var video = document.getElementById('v');
  var panel = document.getElementById('panel');
  var list = document.getElementById('list');
  var osd = document.getElementById('osd');
  var clock = document.getElementById('clock');
  var msg = document.getElementById('msg');
  var hls = null, playing = 0, sel = 0, osdT, panelT, cursorT;

  // ---- Construction de la liste ----
  CHANNELS.forEach(function(c, i){
    var b = document.createElement('button');
    b.className = 'ch';
    b.innerHTML = '<span class="n">'+(i+1)+'</span><span><span class="nm">'+c.name+'</span><span class="ar">'+c.ar+'</span></span><span class="live">● LIVE</span>';
    b.addEventListener('click', function(e){ e.stopPropagation(); play(i); closePanel(); });
    b.addEventListener('mouseenter', function(){ setSel(i); });
    list.appendChild(b);
  });
  var items = Array.prototype.slice.call(list.children);

  // ---- Lecture ----
  function say(t){ msg.textContent = t || ""; msg.classList.toggle('show', !!t); }
  function loading(on){ document.body.classList.toggle('loading', !!on); }

  function load(urls, k){
    if(k >= urls.length){ loading(false); say("Flux indisponible. Appuyez sur OK pour réessayer."); return; }
    say(""); loading(true);
    if(hls){ hls.destroy(); hls = null; }
    if(window.Hls && Hls.isSupported()){
      hls = new Hls({
        // Plus de marge derrière le direct = moins de saccades
        liveSyncDurationCount: 5,          // ~5 segments de retard sur le direct
        liveMaxLatencyDurationCount: 12,
        maxBufferLength: 40,
        maxMaxBufferLength: 90,
        backBufferLength: 30,
        maxBufferHole: 1,
        nudgeMaxRetry: 10,
        lowLatencyMode: false,
        enableWorker: true,
        fragLoadingMaxRetry: 8,
        manifestLoadingMaxRetry: 6,
        levelLoadingMaxRetry: 6,
        startFragPrefetch: true
      });
      var stalls = [];
      hls.loadSource(urls[k]);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, function(_, data){
        // Bloquer sur la meilleure qualité pour éviter les changements de qualité (source de micro-coupures)
        if(data.levels && data.levels.length > 1){
          var best = 0;
          data.levels.forEach(function(l, i){ if((l.bitrate||0) > (data.levels[best].bitrate||0)) best = i; });
          hls.currentLevel = best;
        }
        video.play().catch(function(){ say("Appuyez sur OK pour lancer la vidéo."); });
      });
      hls.on(Hls.Events.ERROR, function(_, d){
        if(d.details === Hls.ErrorDetails.BUFFER_STALLED_ERROR){
          // Si ça bloque souvent, on repasse en qualité automatique
          var now = Date.now(); stalls.push(now);
          stalls = stalls.filter(function(t){ return now - t < 60000; });
          if(stalls.length >= 3 && hls.autoLevelEnabled === false){ hls.currentLevel = -1; stalls = []; }
        }
        if(!d.fatal) return;
        if(d.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
        else if(d.type === Hls.ErrorTypes.NETWORK_ERROR && d.details && d.details.indexOf('manifest') === -1) hls.startLoad();
        else load(urls, k+1);
      });
    } else if(video.canPlayType('application/vnd.apple.mpegurl')){
      video.src = urls[k];
      video.onerror = function(){ load(urls, k+1); };
      video.play().catch(function(){ say("Touchez l'écran pour lancer la vidéo."); });
    } else { loading(false); say("Ce navigateur ne sait pas lire ce flux."); }
  }

  function play(i){
    playing = (i + CHANNELS.length) % CHANNELS.length;
    setSel(playing);
    items.forEach(function(b, j){ b.classList.toggle('playing', j === playing); });
    try{ localStorage.setItem('ch', CHANNELS[playing].id); }catch(e){}
    showOsd();
    load(CHANNELS[playing].urls, 0);
  }

  video.addEventListener('playing', function(){ loading(false); say(""); });
  video.addEventListener('waiting', function(){ loading(true); });

  // ---- Interface ----
  function setSel(i){ sel = (i + CHANNELS.length) % CHANNELS.length; items.forEach(function(b, j){ b.classList.toggle('sel', j === sel); }); }
  function showOsd(){
    var c = CHANNELS[playing];
    document.getElementById('osdNum').textContent = playing + 1;
    document.getElementById('osdName').textContent = c.name;
    document.getElementById('osdAr').textContent = c.ar;
    osd.classList.add('show'); clock.classList.add('show');
    clearTimeout(osdT); osdT = setTimeout(function(){ osd.classList.remove('show'); if(!isOpen()) clock.classList.remove('show'); }, 4000);
  }
  function isOpen(){ return panel.classList.contains('open'); }
  function openPanel(){ setSel(playing); panel.classList.add('open'); clock.classList.add('show'); armPanel(); }
  function closePanel(){ panel.classList.remove('open'); clearTimeout(panelT); }
  function armPanel(){ clearTimeout(panelT); panelT = setTimeout(closePanel, 8000); }

  // ---- Télécommande / clavier ----
  // Touches gérées : flèches, OK (Entrée), Retour (Échap / Retour navigateur / Retour arrière),
  // chaîne +/- (PageUp/PageDown, MediaTrackNext/Previous), chiffres, lecture/pause.
  // ---- Chiffres : 1, 2… ou 12, 25… (validation auto après 1,5 s ou avec OK) ----
  var digitsEl = document.getElementById('digits'), buf = "", bufT;
  function digitOf(e){
    var m = /^(?:Digit|Numpad)([0-9])$/.exec(e.code || "");
    if(m) return m[1];                                   // touches chiffres, même si Verr. Num est désactivé
    if(/^[0-9]$/.test(e.key)) return e.key;              // télécommandes qui envoient directement le chiffre
    return null;
  }
  function typeDigit(d){
    if(buf === "" && d === "0") return;
    buf += d;
    digitsEl.className = 'digits show'; digitsEl.textContent = buf;
    clearTimeout(bufT);
    // Valider tout de suite si aucun numéro plus long n'est possible
    if(+buf * 10 > CHANNELS.length || buf.length >= 3) bufT = setTimeout(commitDigits, 400);
    else bufT = setTimeout(commitDigits, 1500);
  }
  function commitDigits(){
    clearTimeout(bufT);
    var n = +buf; buf = "";
    if(n >= 1 && n <= CHANNELS.length){
      digitsEl.className = 'digits'; closePanel();
      if(n - 1 !== playing) play(n - 1); else showOsd();
    } else {
      digitsEl.className = 'digits show bad'; digitsEl.textContent = "Chaîne " + n + " inexistante";
      bufT = setTimeout(function(){ digitsEl.className = 'digits'; }, 1800);
    }
  }

  var BACK = ['Escape','BrowserBack','GoBack','Backspace','XF86Back'];
  document.addEventListener('keydown', function(e){
    var k = e.key;
    wakeCursor(false);

    var d = digitOf(e);
    if(d !== null){ e.preventDefault(); typeDigit(d); return; }
    if(k === 'PageUp' || k === 'ChannelUp' || k === 'MediaTrackPrevious'){ e.preventDefault(); play(playing - 1); return; }
    if(k === 'PageDown' || k === 'ChannelDown' || k === 'MediaTrackNext'){ e.preventDefault(); play(playing + 1); return; }
    if(k === ' ' || k === 'MediaPlayPause'){ e.preventDefault(); if(video.paused) video.play().catch(function(){}); else video.pause(); return; }

    if(buf !== "" && k === 'Enter'){ e.preventDefault(); commitDigits(); return; }

    if(BACK.indexOf(k) > -1){
      e.preventDefault();
      if(isOpen()) closePanel(); else showOsd();
      return;
    }

    if(isOpen()){
      armPanel();
      if(k === 'ArrowUp'){ e.preventDefault(); setSel(sel - 1); }
      else if(k === 'ArrowDown'){ e.preventDefault(); setSel(sel + 1); }
      else if(k === 'Enter' || k === 'ArrowRight'){ e.preventDefault(); if(sel !== playing) play(sel); closePanel(); }
      else if(k === 'ArrowLeft'){ e.preventDefault(); closePanel(); }
    } else {
      if(k === 'ArrowUp'){ e.preventDefault(); play(playing - 1); }
      else if(k === 'ArrowDown'){ e.preventDefault(); play(playing + 1); }
      else if(k === 'Enter'){
        e.preventDefault();
        if(msg.classList.contains('show')){ play(playing); return; }   // réessayer
        if(video.paused) video.play().catch(function(){});
        openPanel();
      }
      else if(k === 'ArrowLeft' || k === 'ArrowRight' || k === 'ContextMenu'){ e.preventDefault(); openPanel(); }
      else if(k === 'i' || k === 'Info'){ showOsd(); }
    }
  }, true);

  // Empêcher le bouton Retour de quitter l'appli
  try{
    history.pushState({tv:1}, "");
    window.addEventListener('popstate', function(){
      history.pushState({tv:1}, "");
      if(isOpen()) closePanel(); else showOsd();
    });
  }catch(e){}

  // Souris / air mouse / écran tactile
  document.addEventListener('click', function(){
    if(video.paused) video.play().catch(function(){});
    if(isOpen()) closePanel(); else openPanel();
  });
  function wakeCursor(show){
    document.body.classList.toggle('nocursor', !show);
    clearTimeout(cursorT);
    if(show) cursorT = setTimeout(function(){ document.body.classList.add('nocursor'); }, 2500);
  }
  document.addEventListener('mousemove', function(){ wakeCursor(true); });
  wakeCursor(false);

  // Horloge
  function tick(){ var d = new Date(); clock.textContent = String(d.getHours()).padStart(2,'0') + ":" + String(d.getMinutes()).padStart(2,'0'); }
  tick(); setInterval(tick, 10000);

  // Démarrage sur la dernière chaîne
  var start = 0;
  try{ var last = localStorage.getItem('ch'); CHANNELS.forEach(function(c, i){ if(c.id === last) start = i; }); }catch(e){}
  play(start);
})();
</script>
</body>
</html>
